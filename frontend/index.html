<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="An AI assistant that answers recruiter questions from a verified candidate profile, alongside a structured profile view and an approximate profile-to-job match report."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: dark)" />
    <title>AI Portfolio Assistant</title>
    <script>
      // Applied before first paint so the correct theme is never flashed.
      (function () {
        try {
          var STORAGE_KEY = 'ai-portfolio-theme';
          var stored = window.localStorage.getItem(STORAGE_KEY);
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (error) {
          /* no-op: fall back to the light theme defined in CSS */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
