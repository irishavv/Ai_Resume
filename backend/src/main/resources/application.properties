server.port=${BACKEND_PORT:8080}
spring.application.name=ai-portfolio-backend
# Load the single repo-root .env (KEY=VALUE) so the backend, the AI service and
# the frontend all share one configuration file. Both paths are optional, so the
# file is found whether the app runs from backend/ (Maven) or from the repo root (IDE).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_portfolio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai-service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
ai-service.response-timeout-ms=${AI_RESPONSE_TIMEOUT_MS:120000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}
# Operator console login credentials.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.session-ttl-minutes=${ADMIN_SESSION_TTL_MINUTES:480}
# Effective defaults for the runtime limits the console can override; the stored
# settings document always wins once an operator has saved one.
app.rate-limit.chat-per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:20}
app.chat.history-limit=${CHAT_HISTORY_LIMIT:20}
# Resume upload: hard limits enforced both by the servlet container and the resume service.
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:6MB}
app.resume.max-bytes=${RESUME_MAX_BYTES:5242880}
logging.level.root=INFO
